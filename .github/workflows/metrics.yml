name: Metrics

on:
  # Atualiza todo dia às 03:00 UTC (00:00 em Brasília)
  schedule:
    - cron: "0 3 * * *"
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # Roda também a cada push na branch principal
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Card de linguagens
      - name: Linguagens
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_limit: 20
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage
          extras_css: |
            body, .background { background: #000000 !important; }
            h2, h2 * { color: #ffffff !important; }
            .field, .field * { color: #cccccc !important; }
            a, a * { color: #ffffff !important; }
            svg { background: #000000 !important; }

      # Calendário de contribuições (heatmap isométrico)
      - name: Calendário
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.calendar.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: |
            body, .background { background: #000000 !important; }
            h2, h2 * { color: #ffffff !important; }
            .field, .field * { color: #cccccc !important; }
            a, a * { color: #ffffff !important; }
            svg { background: #000000 !important; }
